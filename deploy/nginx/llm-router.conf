# Nginx origin configuration for the public Router endpoint.
# Cloudflare terminates TLS; this origin listens on HTTP and forwards to the
# Docker-published Router port.
server {
  listen 80;
  server_name llm-router.sky1218.com;

  # Responses continuations can contain several megabytes of input history.
  client_max_body_size 50m;

  location / {
    proxy_pass http://127.0.0.1:38128;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
